.fmini-bar { display:flex; gap:4px; margin-bottom:8px; }
.fmini-dot { width:6px; height:6px; border-radius:50%; }
.fmini-row { display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:6px; background:white; border:1px solid var(--gray-200); margin-bottom:4px; font-size:11px; color:var(--gray-600); }
.fmini-avatar { width:18px; height:18px; border-radius:50%; background:var(--accent-light); display:flex; align-items:center; justify-content:center; font-size:8px; flex-shrink:0; color:var(--accent); font-weight:700; }
.fmini-badge { margin-left:auto; font-size:9px; font-weight:700; padding:2px 6px; border-radius:8px; }

/* 1. ?�디??매칭 */
@keyframes matchSelect { 0%,15%{opacity:0;transform:translateY(-5px)} 28%,68%{opacity:1;transform:translateY(0)} 80%,100%{opacity:0;transform:translateY(5px)} }
.fmini-match-row { animation:matchSelect 3.6s ease infinite; }
.fmini-match-row:nth-child(2){animation-delay:.5s}
.fmini-match-row:nth-child(3){animation-delay:1s}
@keyframes matchHL { 0%,35%{background:white;border-color:var(--gray-200)} 48%,68%{background:var(--accent-light);border-color:var(--accent)} 80%,100%{background:white;border-color:var(--gray-200)} }
.fmini-match-row.hl { animation:matchHL 3.6s ease infinite; animation-delay:1s; }

/* 2. 채팅 ?�통 */
@keyframes chatIn { 0%,18%{opacity:0;transform:translateY(6px)} 32%,80%{opacity:1;transform:translateY(0)} 93%,100%{opacity:0} }
.fmini-chat-msg { animation:chatIn 4s ease infinite; margin-bottom:4px; }
.fmini-chat-msg:nth-child(2){animation-delay:.9s}
.fmini-chat-msg:nth-child(3){animation-delay:1.8s}
.fmini-bubble { display:inline-block; padding:4px 8px; border-radius:8px; font-size:10px; max-width:82%; line-height:1.4; }
.fmini-me { text-align:right; }
.fmini-me .fmini-bubble { background:var(--accent); color:white; border-radius:8px 8px 2px 8px; }
.fmini-other .fmini-bubble { background:white; border:1px solid var(--gray-200); color:var(--gray-700); border-radius:8px 8px 8px 2px; }

/* 3. 칸반 ?�동 */
@keyframes kanMove { 0%,18%{transform:translateX(0);opacity:1} 38%{transform:translateX(10px);opacity:.5} 52%,78%{transform:translateX(22px);opacity:1} 92%,100%{transform:translateX(0);opacity:1} }
.fmini-kcard { animation:kanMove 3.5s ease infinite; }
@keyframes kanBadge { 0%,38%{background:#fef3c7;color:#92400e} 52%,80%{background:#d1fae5;color:#065f46} 92%,100%{background:#fef3c7;color:#92400e} }
.fmini-kbadge { animation:kanBadge 3.5s ease infinite; }

/* 4. ?�품 ???�로그레??*/
@keyframes progFill { 0%{width:0%} 65%{width:100%} 80%,100%{width:100%} }
@keyframes progLabel { 0%,60%{opacity:0} 70%,85%{opacity:1} 95%,100%{opacity:0} }
.fmini-prog-fill { animation:progFill 3.2s ease infinite; }
.fmini-prog-done { animation:progLabel 3.2s ease infinite; }

/* 5. ?�정 체크 */
@keyframes checkPop { 0%,12%{opacity:0;transform:scale(.4)} 26%,75%{opacity:1;transform:scale(1)} 88%,100%{opacity:0;transform:scale(.4)} }
.fmini-chk { animation:checkPop 4s ease infinite; }
.fmini-chk:nth-child(2){animation-delay:.7s}
.fmini-chk:nth-child(3){animation-delay:1.4s}

/* 6. B2B ?�치 */
@keyframes numUp { 0%{opacity:.3;transform:translateY(4px)} 30%,70%{opacity:1;transform:translateY(0)} 90%,100%{opacity:.3;transform:translateY(-4px)} }
.fmini-stat { animation:numUp 2.6s ease infinite; }
.fmini-stat:nth-child(2){animation-delay:.5s}
.fmini-stat:nth-child(3){animation-delay:1s}

/* 7. AI ?�캔 */
@keyframes aiBar { 0%{width:0%;opacity:.6} 55%{width:100%;opacity:1} 70%,100%{width:100%;opacity:.3} }
.fmini-aibar { animation:aiBar 2.2s ease infinite; }
.fmini-aibar:nth-child(1){animation-delay:0s}
.fmini-aibar:nth-child(2){animation-delay:.35s}
.fmini-aibar:nth-child(3){animation-delay:.7s}
@keyframes aiPulse { 0%,100%{opacity:.4} 50%{opacity:1} }
.fmini-aiicon { animation:aiPulse 1.2s ease infinite; }

/* ========== PROCESS ========== */
.process-section { background: var(--primary); }
.process-section .section-title { color: white; }
.process-section .section-eyebrow { color: rgba(255,255,255,0.6); }
.process-section .section-desc { color: rgba(255,255,255,0.6); }
/* ===== PROCESS STEP GRID (A?? ===== */
.pstep-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  max-width: 1160px;
  margin: 0 auto 32px;
}
.pstep-card {
  background: white;
  border: 1.5px solid var(--gray-200);
  border-radius: 16px;
  padding: 28px 16px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all .2s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
}
.pstep-card:hover {
  border-color: rgba(92,61,232,0.4);
  box-shadow: 0 4px 20px rgba(92,61,232,0.1);
  transform: translateY(-2px);
}
.pstep-card.active {
  background: white;
  border-color: #7c3aed;
  box-shadow: 0 0 0 3px rgba(92,61,232,0.15), 0 4px 20px rgba(92,61,232,0.12);
}
.pstep-card.done {
  background: #f5f3ff;
  border-color: rgba(92,61,232,0.25);
}
.pstep-num {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: #5c3de8;
  color: white;
  font-size: 13px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.pstep-card:not(.done):not(.active) .pstep-num {
  background: var(--gray-100);
  color: var(--gray-400);
}
.pstep-icon { font-size: 40px; line-height: 1; display:flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:18px; background:var(--gray-50); margin:0 auto; }
.pstep-card:not(.done):not(.active) .pstep-icon { opacity: .25; }
.pstep-card.done .pstep-icon { background: rgba(92,61,232,0.08); }
.pstep-card.active .pstep-icon { background: rgba(92,61,232,0.1); box-shadow: 0 0 0 3px rgba(92,61,232,0.1); }
.pstep-title {
  font-size: 14px; font-weight: 700; color: var(--primary);
}
.pstep-card:not(.done):not(.active) .pstep-title { color: var(--gray-400); }
.pstep-desc {
  font-size: 12px; color: var(--gray-400); line-height: 1.5;
}
.pstep-card:not(.done):not(.active) .pstep-desc { color: var(--gray-300); }

/* ?�세 카드 */
.pstep-detail {
  max-width: 1160px;
  margin: 0 auto;
  background: white;
  border: 1.5px solid rgba(92,61,232,0.2);
  border-radius: 16px;
  padding: 28px 32px;
  display: flex;
  align-items: flex-start;
  gap: 24px;
  text-align: left;
  box-shadow: 0 4px 20px rgba(92,61,232,0.08);
}
.pstep-detail-num {
  font-size: 40px; font-weight: 900;
  color: #5c3de8;
  line-height: 1;
  min-width: 44px;
  flex-shrink: 0;
}
.pstep-detail-title {
  font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 6px;
}
.pstep-detail-text {
  font-size: 13px; color: var(--gray-500); line-height: 1.7;
}
.pstep-detail-badge {
  display: inline-block; margin-top: 8px;
  font-size: 11px; padding: 3px 10px;
  border-radius: 20px;
  background: rgba(92,61,232,0.08);
  color: #5c3de8;
  border: 1px solid rgba(92,61,232,0.2);
}

/* 모바????2??그리??*/
@media (max-width: 768px) {
  .pstep-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .pstep-card:last-child { grid-column: 1 / -1; }
  .pstep-card { padding: 14px 12px; flex-direction: row; text-align: left; gap: 12px; }
  .pstep-icon { font-size: 24px; width:44px; height:44px; border-radius:12px; }
  .pstep-detail { flex-direction: column; gap: 10px; padding: 16px; }
  .pstep-detail-num { font-size: 28px; }
}
@media (max-width: 480px) {
  .pstep-card { padding: 12px 10px; }
  .pstep-title { font-size: 12px; }
  .pstep-desc { font-size: 11px; }
}

/* ========== PRICING ========== */
.pricing-grid {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 16px;
  max-width: 1160px;
  margin: 60px auto 0;
}
.pricing-grid-3col {
  grid-template-columns: repeat(3,1fr);
}
.price-card {
  background: white;
  border: 1.5px solid var(--gray-200);
  border-radius: 20px;
  padding: 32px 24px;
  transition: all .25s;
  position: relative;
}
.price-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); }
.price-card.featured {
  border-color: #5c3de8;
  border-width: 2px;
  background: linear-gradient(to bottom, #f5f3ff, white 60%);
  box-shadow: 0 8px 40px rgba(92,61,232,0.15);
  transform: translateY(-8px);
  z-index: 2;
  position: relative;
}
.price-card.featured::before {
  content: '가??많이 ?�택';
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  background: #5c3de8;
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 16px;
  border-radius: 100px;
  white-space: nowrap;
  letter-spacing: .5px;
}
.price-card.featured:hover { transform: translateY(-12px); }
.price-card.popular {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(92,61,232,0.08);
}
.popular-badge {
  position: absolute; top: -14px; left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: white;
  font-size: 12px; font-weight: 700;
  padding: 5px 16px;
  border-radius: 100px;
  white-space: nowrap;
}
.price-plan { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 1px; margin-bottom: 12px; }
.price-amount { font-size: 42px; font-weight: 900; color: var(--primary); letter-spacing: -1px; line-height: 1; }
.price-amount sub { font-size: 16px; color: var(--gray-400); font-weight: 400; vertical-align: middle; }
.price-per { font-size: 13px; color: var(--gray-400); margin: 8px 0 20px; }
.price-divider { height: 1px; background: var(--gray-200); margin-bottom: 20px; }
.price-features { list-style: none; display: flex; flex-direction: column; gap: 11px; margin-bottom: 32px; }
.price-features li { font-size: 14px; color: var(--gray-600); display: flex; gap: 10px; align-items: flex-start; }
.price-features li .check { color: var(--green); flex-shrink: 0; margin-top: 2px; }
.price-features li .cross { color: var(--gray-300); flex-shrink: 0; margin-top: 2px; }

/* B2B */
.b2b-block {
  max-width: 800px; margin: 40px auto 0;
  background: linear-gradient(135deg, var(--primary), #2d2b6b);
  border-radius: 20px;
  padding: 48px 48px;
  display: flex; align-items: center; gap: 40px;
  color: white;
}
.b2b-left { flex: 1; }
.b2b-eyebrow { font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 2px; font-weight: 700; margin-bottom: 10px; }
.b2b-title { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 10px; word-break: keep-all; }
.b2b-desc { font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1.7; }

/* ========== REVIEWS ========== */
.reviews-section { }
.reviews-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 20px;
  max-width: 1100px;
  margin: 60px auto 0;
}
.review-card {
  background: white;
  border: 1px solid var(--gray-200);
  border-radius: 16px;
  padding: 28px;
  transition: box-shadow .2s;
}
.review-card:hover { box-shadow: var(--shadow); }
.review-stars { color: #f59e0b; font-size: 14px; margin-bottom: 14px; }
.review-text { font-size: 14px; color: var(--gray-600); line-height: 1.75; margin-bottom: 20px; }
.review-author { display: flex; align-items: center; gap: 12px; }
.review-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--gray-100);
}
.review-name { font-size: 14px; font-weight: 700; color: var(--primary); }
.review-company { font-size: 12px; color: var(--gray-400); }

/* ========== FINAL CTA ========== */
.final-cta {
  position: relative;
  text-align: center;
  padding: 0;
  color: white;
  overflow: hidden;
  background: #06040f;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
}
/* 배경 ?�이??1 ?????�크 베이??*/
.final-cta::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 120% 80% at 50% 100%, #1a0a3a 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 20% 30%, #0d1a3a 0%, transparent 55%),
    radial-gradient(ellipse 50% 35% at 80% 20%, #0a1525 0%, transparent 55%),
    linear-gradient(160deg, #080514 0%, #0e0820 35%, #06040f 60%, #0a0618 100%);
  z-index: 0;
}
/* 배경 ?�이??2 ??모니??글로우 + ?�름 ?�트�??�낌 */
.final-cta::after {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 45% 30% at 25% 60%, rgba(92,61,232,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 35% 25% at 75% 55%, rgba(59,130,246,0.08) 0%, transparent 70%),
    radial-gradient(ellipse 30% 20% at 50% 50%, rgba(0,0,0,0.5) 0%, transparent 80%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 48px);
  z-index: 1;
}
.final-cta > * { position: relative; z-index: 2; }
.final-cta h2 { font-size: clamp(24px, 3.5vw, 52px); font-weight: 900; letter-spacing: -1.5px; margin-bottom: 16px; text-shadow: 0 0 60px rgba(92,61,232,0.4), 0 2px 32px rgba(0,0,0,0.9); }
.final-cta p { font-size: 16px; color: rgba(255,255,255,0.65); margin-bottom: 36px; text-shadow: 0 1px 12px rgba(0,0,0,0.8); }
.final-cta-btns { display: flex; gap: 14px; flex-wrap: wrap; }
@media (max-width: 768px) {
  .final-cta-h2 { font-size: clamp(28px, 7.5vw, 36px) !important; line-height: 1.3 !important; word-break: keep-all !important; }
  .final-cta-btns { flex-wrap: nowrap; gap: 10px; justify-content: center; }
  .final-cta-btns .btn-xl { flex: 1; min-width: 0; font-size: 14px; padding: 14px 12px; text-align: center; white-space: nowrap; }
}
.final-cta-inner { display: flex; align-items: center; gap: 60px; max-width: 1160px; margin: 0 auto; }
.final-cta-text { flex: 1; min-width: 280px; text-align: left; }
.final-cta-video { flex-shrink: 0; width: 480px; border-radius: 16px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.12); }
.final-cta-video video { width: 100%; height: 100%; object-fit: cover; display: block; }
.final-cta-video-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(92,61,232,0.15) 0%, transparent 60%); pointer-events: none; }
@media (max-width: 900px) {
  .final-cta-inner { flex-direction: column; gap: 36px; }
  .final-cta-text { text-align: center; }
  .final-cta-text .final-cta-btns { justify-content: center; }
  .final-cta-video { width: 100%; max-width: 520px; }
}

/* ========== FOOTER ========== */
footer {
  background: white;
  border-top: 1px solid var(--gray-200);
  padding: 64px 48px 36px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1.2fr 1.2fr;
  gap: 48px;
  max-width: 1100px;
  margin: 0 auto 40px;
}
@media (max-width: 768px) {
  .footer-grid { grid-template-columns: 1fr; gap: 28px; }
}
.footer-logo-area .logo {
  font-size: 20px; font-weight: 900;
  color: var(--primary); margin-bottom: 10px;
}
.footer-logo-area .logo span { color: var(--accent); }
.footer-desc {
  font-size: 13px; color: var(--gray-400);
  line-height: 1.8; margin-bottom: 20px;
  word-break: keep-all;
}
.footer-addr-block {
  display: flex; flex-direction: column; gap: 10px;
}
.footer-addr-label {
  font-size: 10px; font-weight: 700;
  color: var(--accent); letter-spacing: .8px;
  margin-bottom: 4px;
}
.footer-addr-row {
  display: flex; gap: 8px; align-items: flex-start;
}
.footer-addr-badge {

.footer-addr-text {
  font-size: 12px; color: var(--gray-400);
  line-height: 1.7; word-break: keep-all;
}
.footer-addr-zip {
  font-size: 11px; color: var(--gray-300);

}
.footer-contact {
  font-size: 12px; color: var(--gray-400);

}
.footer-heading {
  font-size: 12px; font-weight: 700;

.footer-links {

/* ========== MODAL / AUTH ========== */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal-box {
  background: white;
  border-radius: 20px;
  width: 92%; max-width: 460px;
  padding: 36px 32px;
  position: relative;
  box-shadow: var(--shadow-lg);
  animation: modalIn .25s ease;
  box-sizing: border-box;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(10px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-close {
  position: absolute; top: 16px; right: 20px;
  background: var(--gray-100); border: none;
  width: 32px; height: 32px;
  border-radius: 50%; font-size: 16px;
  cursor: pointer; color: var(--gray-600);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--gray-200); }
.modal-logo { font-size: 16px; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
.modal-logo span { color: var(--accent); }
.modal-title { font-size: 24px; font-weight: 900; color: var(--primary); margin-bottom: 6px; letter-spacing: -0.5px; }
.modal-sub { font-size: 14px; color: var(--gray-400); margin-bottom: 28px; }
.tab-switch {
  display: flex; background: var(--gray-100);
  border-radius: 10px; padding: 4px; gap: 4px;
  margin-bottom: 28px;
}
.tab-switch button {
  flex: 1; padding: 9px;
  border: none; border-radius: 8px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; background: transparent;
  color: var(--gray-400); font-family: inherit;
  transition: all .2s;
}
.tab-switch button.active { background: white; color: var(--primary); box-shadow: var(--shadow-sm); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 12px; font-weight: 700; color: var(--gray-600); display: block; margin-bottom: 7px; letter-spacing: 0.3px; }
.form-input {
  width: 100%;
  background: var(--gray-50);
  border: 1.5px solid var(--gray-200);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px; color: var(--primary);
  font-family: inherit;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,61,232,0.1); background: white; }
.form-select {
  width: 100%;
  background: var(--gray-50);
  border: 1.5px solid var(--gray-200);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px; color: var(--primary);
  font-family: inherit;
  outline: none; appearance: none; cursor: pointer;
  transition: border-color .2s;
}
.form-select:focus { border-color: var(--accent); }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) {
  .modal-box .form-2col { grid-template-columns: 1fr; gap: 0; }
}
.divider-text {

/* ========== DASHBOARD ========== */
.dash-wrap {

}
.sidebar {

/* METRICS */
.metrics-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 24px; }
.metric-card {

}

/* CARDS / PANELS */
.panel {

}

}

/* TABLE */

.data-table th {

  text-transform: uppercase;
}

}

.badge {

}

/* UPLOAD */
.upload-zone {

}

}

.upload-zone-sub { font-size: 13px; color: var(--gray-400); }

/* PROGRESS BAR */
.progress-bar-wrap { background: var(--gray-200); border-radius: 100px; height: 6px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 100px; transition: width .5s; }

/* ORDER DETAIL */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.detail-item label { font-size: 11px; font-weight: 700; color: var(--gray-400); letter-spacing: 0.5px; display: block; margin-bottom: 5px; text-transform: uppercase; }

/* PROGRESS STEPS */
.step-progress { display: flex; align-items: center; margin: 20px 0; }
.sp-item { flex: 1; text-align: center; position: relative; }
.sp-item:not(:last-child)::after {

  height: 2px;
  background: var(--gray-200);
  z-index: 0;
}
.sp-item.done:not(:last-child)::after,
.sp-item.active:not(:last-child)::after { background: var(--accent); }
.sp-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--gray-200);
  border: 2px solid var(--gray-200);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 8px;
  font-size: 12px; font-weight: 700;
  color: var(--gray-400);

}
.sp-item.done .sp-dot { background: var(--accent); border-color: var(--accent); color: white; }
.sp-item.active .sp-dot { background: white; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px rgba(92,61,232,0.15); }
.sp-label { font-size: 11px; font-weight: 600; color: var(--gray-400); }
.sp-item.active .sp-label { color: var(--accent); }
.sp-item.done .sp-label { color: var(--primary); }

.chat-window {

}

.msg-bubble {

.chat-input-row { display: flex; gap: 10px; padding: 16px; }

/* FLOATING CHAT */
.fc-btn {

        var progress = Math.min((ts - start) / dur, 1);
        var ease = 1 - Math.pow(1 - progress, 4); // easeOutQuart

        else el.textContent = target;

            el.textContent = isFloat ? val.toFixed(1) : Math.floor(val);
            if (p < 1) requestAnimationFrame(step);
            else el.textContent = isFloat ? target.toFixed(1) : target;
          })(performance.now());
        });

/* ===== VFX ?�션 Scroll-driven Zoom ===== */
(function() {
  function initVfxScroll() {
    var sec  = document.getElementById('vfx-section');
    var vid  = document.getElementById('vfxBgVideo');
    var ovl  = document.getElementById('vfxOverlay');
    var els  = ['vfxEyebrow','vfxTitle','vfxDesc','vfxTags','vfxCta'].map(function(id){ return document.getElementById(id); });
    if (!sec || !vid) return;

    var entered = false;

    function onScroll() {
      var rect = sec.getBoundingClientRect();
      var wh   = window.innerHeight;

      // ?�션??뷰포???�에 ?�는 비율 (0~1)
      var visible = Math.max(0, Math.min(1, (wh - rect.top) / (wh + rect.height)));

      // 진입 ?�니메이????50% ?�상 보이�??�리�?      if (visible > 0.3 && !entered) {
        entered = true;
        els.forEach(function(el){ if(el){ el.style.opacity='1'; el.style.transform='translateY(0)'; } });
      }
      if (visible < 0.1 && entered) {
        entered = false;
        els.forEach(function(el){ if(el){ el.style.opacity='0'; } });
      }

      // scroll-driven zoom ???�션 중앙 ?�과 ??scale 1.15 ??1.0
      var progress = Math.max(0, Math.min(1, (wh - rect.top) / wh));
      var scale    = 1.15 - progress * 0.15;  // 1.15 ??1.0
      vid.style.transform = 'scale(' + scale.toFixed(3) + ')';

      // ?�버?�이 밝기 ??진입?�수�??�짝 ?�두?�졌??밝아�?      var alpha = 0.45 - progress * 0.1;
      if (ovl) ovl.style.background = 'rgba(0,0,0,' + alpha.toFixed(2) + ')';
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // 초기 ?�행
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVfxScroll);
  } else {
    initVfxScroll();
  }
})();

function getSession() {
  try {
    var s = JSON.parse(localStorage.getItem('aicut_session'));
    if (!s) return null;
    // 만료 체크
    if (s.expireAt && Date.now() > s.expireAt) {
      localStorage.removeItem('aicut_session');
      return null;
    }
    return s;
  } catch { return null; }
}

// YouTube URL ??ID 추출
function _extractYTId(url) {
  if (!url) return '';
  var m = url.match(/(?:shorts\/|youtu\.be\/|embed\/|watch\?v=|&v=)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : '';
}

    url:       urlVal,
    genre:     genre,
    order:     order,
    createdAt: null // serverTimestamp ?�래?�서 ?�정
  };

  function _doSave(imageUrl, fileName) {
    import('https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js').then(function(fs) {
      var data = {

  if (window._promoFile) {
    // ?��?지 ?�으�?Storage ?�로?????�??    var file     = window._promoFile;
    var fileName = 'promotions/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9._]/g, '_');
    showToast('???��?지 ?�로??�?..');
    Promise.all([
      import('https://www.gstatic.com/firebasejs/11.6.0/firebase-storage.js')
    ]).then(function(mods) {

      var stRef = st.ref(st.getStorage(), fileName);
      st.uploadBytes(stRef, file).then(function(snap) {

      }).then(function(url) {
        _doSave(url, fileName);

window.loadMainPromoVideos = function() {
  if (!window._db) { setTimeout(loadMainPromoVideos, 500); return; }

  var isMobileDevice = ('ontouchstart' in window) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  function _applyCard(parentEl, item, idx) {
    var genre = item.genre || '';
    parentEl.innerHTML = '';

    var wrap = document.createElement('div');
    wrap.style.cssText = 'width:100%;height:100%;border-radius:18px;overflow:hidden;background:#111';

    if (item.imageUrl) {
      // ?�드�??�로???��?지
      var img = document.createElement('img');
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      img.src = item.imageUrl;
      img.onerror = function() {
        parentEl.innerHTML = '';
        var fallback = _promoGetCardByIndex(idx);
        parentEl.appendChild(fallback);
      };
      wrap.appendChild(img);
    } else {
      // ?�덱?�별 기본 카드 (각각 ?�른 ?��?지+?�스??
      wrap = _promoGetCardByIndex(idx);
    }

    parentEl.appendChild(wrap);
  }

  function _applyAll(items) {
    for (var i = 0; i < 5; i++) {
      (function(idx) {
        var item  = items[idx] || {};
        var genre = item.genre || '';
        [idx + 1, idx + 6].forEach(function(num) {
          var frame = document.getElementById('shortsIframe' + num);
          if (frame) _applyCard(frame.parentNode, item, idx);
        });
        var tagEls   = document.querySelectorAll('.sv-tag');
        var labelEls = document.querySelectorAll('.sv-label');
        if (tagEls[idx])       tagEls[idx].textContent       = genre;
        if (tagEls[idx+5])     tagEls[idx+5].textContent     = genre;
        if (labelEls[idx])     labelEls[idx].textContent     = genre;
        if (labelEls[idx+5])   labelEls[idx+5].textContent   = genre;
      })(i);
    }
  }

  import('https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js').then(function(fs) {
    var q = fs.query(fs.collection(window._db, 'promotions'), fs.orderBy('order', 'asc'));
    fs.getDocs(q).then(function(snap) {
      var items = [];
      if (!snap.empty) snap.forEach(function(doc) { items.push(doc.data()); });
      while (items.length < 5) items.push({});
      _applyAll(items);
    }).catch(function(e) {
      console.warn('[promo]', e.message);
      _applyAll([{},{},{},{},{}]);
    });
  }).catch(function() { _applyAll([{},{},{},{},{}]); });
};

function _h(s){var h=0;for(var i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString(16);}
async function _sha(pw){
  var buf=new TextEncoder().encode(pw);
  var ab=await crypto.subtle.digest('SHA-256',buf);
  return Array.from(new Uint8Array(ab)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function _loadClientDashboard(name, email) {
  if (!window._db) {
    setTimeout(function() { _loadClientDashboard(name, email); }, 500);

  }

  var user = window._fbAuth && window._fbAuth.currentUser;
  var uid  = user ? user.uid : null;

  import('https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js').then(function(fs) {
    // uid 기�? 쿼리 (email fallback)
    var q = uid
      ? fs.query(fs.collection(window._db, 'orders'), fs.where('userId', '==', uid))

    // getDocs ?�용 (onSnapshot�?충돌 방�? ???�?�보?�는 1??조회�?충분)
    fs.getDocs(q).then(function(snapshot) {
      var now = new Date();
      var monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

      var docs = [];
      snapshot.forEach(function(d) { docs.push(d.data()); });

      // 최신???�렬
      docs.sort(function(a, b) {
        var ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
        var tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;

        // [3] 최근 ?�뢰 ?�황 (최�? 5�?
        var statusMap = {

        // ?�계 ?�디케?�터 HTML

// ===== COUNTER ANIMATION =====
function animateCounter(el) {
  const target = parseInt(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const duration = 1800;
  const startTime = performance.now();
  function formatNum(n) { return n.toLocaleString('ko-KR'); }
  function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const current = Math.floor(easeOutExpo(progress) * target);
    el.textContent = formatNum(current) + suffix;
    if (progress < 1) requestAnimationFrame(step);
    else { el.textContent = formatNum(target) + suffix; }
  }
  requestAnimationFrame(step);
}
const counterObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.querySelectorAll('.counter').forEach((c, i) => {
        setTimeout(() => animateCounter(c), i * 120);
      });
      counterObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });
const statsSection = document.getElementById('statsSection');
if (statsSection) counterObserver.observe(statsSection);

    line.style.width = pct + '%';
  }

  function nextStep() {
    _procIdx = (_procIdx + 1) % TOTAL;
    setStep(_procIdx);

    if (_procIdx === TOTAL - 1) {
      // 마�?�??�계 ?�달 ???�시 ?��???리셋
      clearInterval(_procTimer);
      setTimeout(() => {
        _procIdx = 0;
        setStep(0);
        _procTimer = setInterval(nextStep, STEP_DELAY);
      }, PAUSE_AFTER_DONE);
    }
  }

  function startProcessAnim() {
    if (_procStarted) return;
    _procStarted = true;
    setStep(0);
    _procTimer = setInterval(nextStep, STEP_DELAY);
  }

  // ?�면??보일 ???�작
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) startProcessAnim();
    });
  }, { threshold: 0.3 });

  document.addEventListener('DOMContentLoaded', () => {
    const section = document.getElementById('processSteps');
    if (section) observer.observe(section);
  });
})();

// ?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═??// 초기 ?�어 감�?
// ?�선?�위: URL?�라미터 > ?�동?�택(manual) > 브라?��??�어 > 기본(ko)
// ?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═?�═??(function initLang() {
  var langMap = { ko:'ko', en:'en', ja:'ja', zh:'zh',
                  'zh-CN':'zh', 'zh-TW':'zh', 'zh-HK':'zh' };

  // 1. URL 경로?�서 ?�어 감�? (/en /ja /zh)
  var path = window.location.pathname;
  var urlPathLang = (path.match(/\/(en|ja|zh)(?:\/|$)/) || [])[1] || null;

  // 2. URL 쿼리 ?�라미터 (?lang=en)
  var urlParamLang = null;
  try {
    urlParamLang = new URLSearchParams(window.location.search).get('lang');
    if (urlParamLang && !langMap[urlParamLang]) urlParamLang = null;
  } catch(e) {}

  var urlLang = urlPathLang || urlParamLang;

  // 3. localStorage ?�기
  var savedLang = null, isManual = false;
  try {
    var manualFlag = localStorage.getItem('aicut_lang_manual');
    // 마이그레?�션: aicut_lang_manual ?��? ?�으�?기존 ?�?�값 무시
    if (manualFlag === null) {
      localStorage.removeItem('aicut_lang');
      localStorage.setItem('aicut_lang_manual', 'false');
    } else if (manualFlag === 'true') {
      savedLang = localStorage.getItem('aicut_lang');
      isManual = true;
    }
  } catch(e) {}

  // 4. 브라?��? ?�어 감�?
  var browserRaw = (navigator.language || navigator.userLanguage || 'ko').toLowerCase();
  var browserShort = browserRaw.slice(0, 2);
  var browserLang = langMap[browserRaw] || langMap[browserShort] || 'en';

  // 5. 최종 ?�어 결정
  var detected;
  if (urlLang) {
    // URL 명시 ??최우??(manual�?간주)
    detected = urlLang;
    try { localStorage.setItem('aicut_lang_manual', 'true'); } catch(e) {}
  } else if (isManual && savedLang && langMap[savedLang]) {
    // ?�용?��? 직접 ?�택??경우 ???�?�값 ?��?
    detected = savedLang;
  } else {
    // ?�동 감�? ??브라?��? ?�어
    detected = browserLang;
  }

  // 6. ko가 ?�니�??�용 (ko??기본값이므�?변�?불필??
  if (detected && detected !== 'ko') {
    setLanguage._fromInit = true;
    setTimeout(function() {
      setLanguage(detected);
      setLanguage._fromInit = false;
    }, 100);
  }
})();

/* ?�?� ?�자 ?�?�라???�텝 �?(nts) ?�?� */
.nts-wrap { width:100%; }
.nts-row  { display:flex; align-items:flex-end; margin-bottom:8px; }
.nts-step { display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; }
.nts-dot  { border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; line-height:1; transition:all .2s; }
/* ?�료 */
.nts-done   .nts-dot { width:36px; height:36px; background:#1f2937; color:#fff; font-size:13px; }
.nts-done   .nts-lbl { font-size:11px; color:#374151; font-weight:600; white-space:nowrap; }
/* ?�재 */
.nts-active .nts-dot {
  width:40px; height:40px; background:#6c63ff; color:#fff; font-size:14px;
  box-shadow:0 0 0 4px rgba(108,99,255,.2);
  animation:ntsGlow 2s ease-in-out infinite;
}
.nts-active .nts-lbl { font-size:12px; color:#6c63ff; font-weight:800; white-space:nowrap; }
/* ?��?*/
.nts-wait   .nts-dot { width:36px; height:36px; background:#f9fafb; border:2px solid #e5e7eb; color:#d1d5db; font-size:12px; }
.nts-wait   .nts-lbl { font-size:11px; color:#d1d5db; white-space:nowrap; }
/* ?�결??*/
.nts-line        { flex:1; margin-bottom:18px; }
.nts-line-done   { height:2px; background:#1f2937; }
.nts-line-active { height:2px; background:linear-gradient(90deg,#1f2937,#e5e7eb); }
.nts-line-wait   { height:0; border-top:2px dashed #e5e7eb; }
/* ?�명 */
.nts-desc { font-size:10px; color:#6c63ff; white-space:nowrap; }
/* 진행 �?*/
.nts-bar-wrap { position:relative; }
.nts-bar      { width:100%; height:3px; background:#f3f4f6; border-radius:2px; overflow:hidden; }
.nts-fill     { height:100%; background:#1f2937; border-radius:2px; transition:width .8s ease; }
.nts-dday     { position:absolute; right:0; top:-18px; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; }
.nts-dday.safe { background:#d1fae5; color:#16a34a; }
.nts-dday.warn { background:#fef3c7; color:#d97706; }
.nts-dday.over { background:#fee2e2; color:#dc2626; }
@keyframes ntsGlow {
  0%,100% { box-shadow:0 0 0 4px rgba(108,99,255,.2); }
  50%     { box-shadow:0 0 0 8px rgba(108,99,255,.1); }
}

/* 모바??*/

/* ?�폼 카드 */
.shorts-card {
  width: 160px;
  height: 280px;
  border-radius: 20px;
  background: linear-gradient(160deg, #1a1040, #0f0f1a);
  border: 1px solid rgba(108,99,255,0.3);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .3s, box-shadow .3s;
  overflow: hidden;
}
.shorts-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(108,99,255,0.1), transparent);
  border-radius: 20px;
}
.shorts-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 20px 40px rgba(108,99,255,0.3); }
.shorts-card-active {
  border-color: #6c63ff;
  background: linear-gradient(160deg, #1e1b4b, #1a1040);
  box-shadow: 0 8px 32px rgba(108,99,255,0.25);
  transform: scale(1.05);
}
.shorts-card-active:hover { transform: translateY(-8px) scale(1.08); }
.shorts-card-inner { text-align: center; z-index: 1; }
.shorts-play {
  width: 48px; height: 48px;
  background: rgba(108,99,255,0.3);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #fff;
  margin: 0 auto 16px;
  border: 1px solid rgba(108,99,255,0.5);
}
.shorts-label { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 6px; }
.shorts-count { font-size: 11px; color: rgba(255,255,255,0.5); }
.shorts-badge {
  position: absolute; top: 12px; right: 12px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px; padding: 3px 10px;
  font-size: 10px; font-weight: 700; color: #fff;
}
.shorts-badge-purple { background: rgba(108,99,255,0.4); }
.shorts-badge-green  { background: rgba(16,185,129,0.3); color: #34d399; }

/* ?�로 비율 ?�시??*/
.shorts-card::after {
  content: '9:16';
  position: absolute;
  bottom: 12px;
  font-size: 9px;
  color: rgba(255,255,255,0.3);
  font-weight: 700;
  letter-spacing: 1px;
}

@media(max-width:480px) {
  .shorts-card { width: 120px; height: 210px; }
  .shorts-ticker { max-width: 100%; }
}
