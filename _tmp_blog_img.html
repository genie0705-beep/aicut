<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:linear-gradient(160deg, #0D1630, #1a1f4e, #064e3b)}
.card{width:600px;height:338px;overflow:hidden;background:linear-gradient(160deg, #0D1630, #1a1f4e, #064e3b);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;position:relative;}
.glow{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,0.15) 0%,transparent 60%);width:384px;height:384px;top:50%;left:50%;transform:translate(-50%,-50%);}
.badge{background:rgba(167,139,250,0.2);color:#a78bfa;padding:6px 18px;border-radius:20px;font-size:14px;font-weight:700;margin-bottom:14px;z-index:2;position:relative;border:1px solid #a78bfa33;}
.main{color:#FFFFFF;font-size:32px;font-weight:900;line-height:1.35;margin-bottom:14px;word-break:keep-all;z-index:2;position:relative;width:100%;}
.main em{color:#34d399;font-style:normal;}
.sub{color:#c0c0d0;font-size:14px;font-weight:400;line-height:1.5;word-break:keep-all;z-index:2;position:relative;width:100%;}
</style></head><body>
<div class="card"><div class="glow"></div>
<div class="badge">💬 지금 상담하세요</div>
<div class="main">첫 달 <em>20% 할인</em><br>이벤트 진행 중</div>
<div class="sub">무료 상담 신청은 카카오톡으로</div>
<div style="background:linear-gradient(135deg,#34d399,#7c3aed);color:#fff;font-size:16px;font-weight:700;padding:10px 32px;border-radius:50px;display:inline-block;margin-top:20px;z-index:2;position:relative;">카톡 무료상담 →</div>
</div></body></html>
