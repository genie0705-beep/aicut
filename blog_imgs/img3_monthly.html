<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 966px; height: 966px; overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  .card {
    width: 966px; height: 966px;
    background: linear-gradient(145deg, #0D1630 0%, #1a1f4e 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; position: relative; overflow: hidden;
    padding: 60px;
  }
  .glow { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(244,185,66,0.25) 0%, transparent 65%);
    width: 700px; height: 700px; top: 50%; left: 50%;
    transform: translate(-50%, -50%); }
  .tag { color: #F4B942; font-size: 32px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 36px; z-index: 2; position: relative; }
  .title { color: #fff; font-size: 58px; font-weight: 900; line-height: 1.2;
    z-index: 2; position: relative; margin-bottom: 50px; }
  .title em { color: #F4B942; font-style: normal; }
  .items { width: 100%; z-index: 2; position: relative; }
  .item { display: flex; align-items: center; gap: 24px;
    background: rgba(255,255,255,0.07); border-radius: 20px;
    padding: 28px 36px; margin-bottom: 18px;
    border-left: 6px solid #F4B942; text-align: left; }
  .check { color: #F4B942; font-size: 40px; flex-shrink: 0; }
  .item-text { color: #fff; font-size: 34px; font-weight: 700; }
  .item-sub { color: rgba(255,255,255,0.55); font-size: 26px; margin-top: 4px; }
  .brand { position: absolute; right: 60px; bottom: 56px;
    color: rgba(255,255,255,0.3); font-size: 28px; font-weight: 900;
    letter-spacing: 4px; z-index: 2; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="tag">에이컷 월정액</div>
  <div class="title">월 4편 기준 <em>49만 원~</em><br>이것들이 다 포함된다</div>
  <div class="items">
    <div class="item">
      <div class="check">✔</div>
      <div>
        <div class="item-text">전담 에디터 고정 배정</div>
        <div class="item-sub">매번 설명 없이 바로 작업</div>
      </div>
    </div>
    <div class="item">
      <div class="check">✔</div>
      <div>
        <div class="item-text">48시간 납품 보장</div>
        <div class="item-sub">업로드 일정 절대 안 밀림</div>
      </div>
    </div>
    <div class="item">
      <div class="check">✔</div>
      <div>
        <div class="item-text">수정 무제한</div>
        <div class="item-sub">브랜드 가이드 누적 저장</div>
      </div>
    </div>
  </div>
  <div class="brand">AICUT</div>
</div>
</body>
</html>
