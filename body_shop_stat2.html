  .card { width: 700px; height: 400px; position: relative; overflow: hidden;

  .badge { display: inline-block; background: #a78bfa20;

  .main em { color: #a78bfa; font-style: normal; }
  .sub { color: #fff99; font-size: 18px; font-weight: 500; line-height: 1.5;

  .checklist { z-index: 2; position: relative; text-align: left; width: 100%; max-width: 500px; }
  .item { color: #fff; font-size: 20px; font-weight: 600; line-height: 1.6;

  .item .num { color: #a78bfa; font-weight: 800; margin-right: 10px; }
  .item .desc { color: #fffCC; font-weight: 400; font-size: 17px; }
  .brand { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    color: #fff20; font-size: 14px; font-weight: 800; letter-spacing: 4px; z-index: 2; }
</style></head>
