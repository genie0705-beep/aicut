  <script>
  (function(){
    // ì¹´ìš´?¸ì—… ? ë‹ˆë©”ì´??    function countUp(el, target, dur) {
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var progress = Math.min((ts - start) / dur, 1);
        var ease = 1 - Math.pow(1 - progress, 4); // easeOutQuart
        el.textContent = Math.floor(ease * target);
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = target;
      }
      requestAnimationFrame(step);
    }
    var fired = false;
    var ob = new IntersectionObserver(function(entries){
      if(entries[0].isIntersecting && !fired){
        fired = true;
        document.querySelectorAll('.stats-count').forEach(function(el){
          var target = parseFloat(el.dataset.target);
          var isFloat = el.dataset.target && el.dataset.target.includes('.');
          var start = null;
          (function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / 1500, 1);
            var ease = 1 - Math.pow(1 - p, 4);
            var val = ease * target;
            el.textContent = isFloat ? val.toFixed(1) : Math.floor(val);
            if (p < 1) requestAnimationFrame(step);
            else el.textContent = isFloat ? target.toFixed(1) : target;
          })(performance.now());
        });
        ob.disconnect();
      }
    },{threshold:0.35});

/* ===== VFX ?¹ì…˜ Scroll-driven Zoom ===== */
(function() {
  function initVfxScroll() {
    var sec  = document.getElementById('vfx-section');
    var vid  = document.getElementById('vfxBgVideo');
    var ovl  = document.getElementById('vfxOverlay');
    var els  = ['vfxEyebrow','vfxTitle','vfxDesc','vfxTags','vfxCta'].map(function(id){ return document.getElementById(id); });
    if (!sec || !vid) return;

    var entered = false;

    function onScroll() {
      var rect = sec.getBoundingClientRect();
      var wh   = window.innerHeight;

      // ?¹ì…˜??ë·°í¬???ˆì— ?ˆëŠ” ë¹„ìœ¨ (0~1)
      var visible = Math.max(0, Math.min(1, (wh - rect.top) / (wh + rect.height)));

      // ì§„ì… ? ë‹ˆë©”ì´????50% ?´ìƒ ë³´ì´ë©??¸ë¦¬ê±?      if (visible > 0.3 && !entered) {
        entered = true;
        els.forEach(function(el){ if(el){ el.style.opacity='1'; el.style.transform='translateY(0)'; } });
      }
      if (visible < 0.1 && entered) {
        entered = false;
        els.forEach(function(el){ if(el){ el.style.opacity='0'; } });
      }

      // scroll-driven zoom ???¹ì…˜ ì¤‘ì•™ ?µê³¼ ??scale 1.15 ??1.0
      var progress = Math.max(0, Math.min(1, (wh - rect.top) / wh));
      var scale    = 1.15 - progress * 0.15;  // 1.15 ??1.0
      vid.style.transform = 'scale(' + scale.toFixed(3) + ')';

      // ?¤ë²„?ˆì´ ë°ê¸° ??ì§„ì…? ìˆ˜ë¡??´ì§ ?´ë‘?Œì¡Œ??ë°ì•„ì§?      var alpha = 0.45 - progress * 0.1;
      if (ovl) ovl.style.background = 'rgba(0,0,0,' + alpha.toFixed(2) + ')';
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll(); // ì´ˆê¸° ?¤í–‰
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initVfxScroll);
  } else {
    initVfxScroll();
  }
})();

function getSession() {

window.handlePromoImageSelect = function(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 5 * 1024 * 1024) { showToast('? ï¸ 5MB ?´í•˜ ?´ë?ì§€ë§??±ë¡ ê°€?¥í•©?ˆë‹¤'); return; }
  window._promoFile = file;
  var reader = new FileReader();
  reader.onload = function(e) {
    var preview = document.getElementById('promoPreview');
    var content = document.getElementById('promoDropContent');
    if (preview) { preview.src = e.target.result; preview.style.display = 'block'; }
    if (content) content.style.display = 'none';
  };
  reader.readAsDataURL(file);
};

  window._promoFile = file;
  var reader = new FileReader();

    var preview = document.getElementById('promoPreview');
    var content = document.getElementById('promoDropContent');
    if (preview) { preview.src = ev.target.result; preview.style.display = 'block'; }

async function _sha(pw){
  var buf=new TextEncoder().encode(pw);
  var ab=await crypto.subtle.digest('SHA-256',buf);

}

    var params = {};

          showToast('?¸ì¦ ?œë¹„???°ê²° ?¤íŒ¨. ? ì‹œ ???¤ì‹œ ?œë„?´ì£¼?¸ìš”');

          .then(function(m) {
            return m.applyActionCode(window._fbAuth, oobCode);
          })
          .then(function() {
            showToast('?‰ ?´ë©”???¸ì¦???„ë£Œ?˜ì—ˆ?µë‹ˆ?? ë¡œê·¸?¸í•´ì£¼ì„¸??);
            setTimeout(function() { openModal('login'); }, 1000);

            setTimeout(function() { openModal('login'); }, 1000);
          });
      };
      waitApply(0);
      return;
    }

    // ?¼ë°˜ ?¸ì…˜ ë³µì›
    var session = getSession();
    if (session) {

});

// ===== COUNTER ANIMATION =====
function animateCounter(el) {
  const target = parseInt(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const duration = 1800;
  const startTime = performance.now();
  function formatNum(n) { return n.toLocaleString('ko-KR'); }
  function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
  function step(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const current = Math.floor(easeOutExpo(progress) * target);
    el.textContent = formatNum(current) + suffix;
    if (progress < 1) requestAnimationFrame(step);
    else { el.textContent = formatNum(target) + suffix; }
  }
  requestAnimationFrame(step);
}
const counterObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.querySelectorAll('.counter').forEach((c, i) => {
        setTimeout(() => animateCounter(c), i * 120);
      });
      counterObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.3 });
const statsSection = document.getElementById('statsSection');
if (statsSection) counterObserver.observe(statsSection);

function calcTotal() {
  let total = _payPlan.price;
  const rawPct = parseInt((document.getElementById('pay-rawlength') || {}).value || '0');
  total += Math.round(_payPlan.price * rawPct / 100);
  if (document.getElementById('opt-express').checked) total += Math.round(_payPlan.price * 0.5);
  if (document.getElementById('opt-subtitle').checked) total += 30000;
  if (document.getElementById('opt-thumbnail').checked) total += 15000;
  return Math.round(total * 1.1); // VAT 10%
}

(function() {

// ===== PROCESS STEP ANIMATION =====
(function() {
  let _procIdx = 0;
  let _procTimer = null;
  let _procStarted = false;
  const TOTAL = 5;
  const STEP_DELAY = 1400; // ê°??¨ê³„ ê°„ê²© ms
  const PAUSE_AFTER_DONE = 1800; // ?„ë£Œ ???€ê¸?ms

  // ì§„í–‰ ?¼ì¸ ?ˆë¹„ ê³„ì‚° (0??5??0??5??00%)
  const lineWidths = [0, 20, 40, 60, 80];

  function setStep(idx) {
    const steps = document.querySelectorAll('.process-step');
    const line = document.getElementById('processLineFill');
    if (!steps.length || !line) return;

    steps.forEach((s, i) => {
      s.classList.remove('active', 'done');
      if (i < idx) s.classList.add('done');
      if (i === idx) s.classList.add('active');
      // done ?íƒœ???«ì ?¨ê¸°ê³????œì‹œ
      const num = s.querySelector('.process-num');
      if (num) {
        if (i < idx) {
          num.style.fontSize = '0px';
        } else {
          num.style.fontSize = i === idx ? '18px' : '16px';
        }
      }
    });

    // ?¼ì¸ ì§„í–‰
    const pct = idx === 0 ? 0 : (idx / (TOTAL - 1)) * 80;
    line.style.width = pct + '%';
  }

  function nextStep() {
    _procIdx = (_procIdx + 1) % TOTAL;
    setStep(_procIdx);

    if (_procIdx === TOTAL - 1) {
      // ë§ˆì?ë§??¨ê³„ ?„ë‹¬ ??? ì‹œ ?€ê¸???ë¦¬ì…‹
      clearInterval(_procTimer);
      setTimeout(() => {
        _procIdx = 0;
        setStep(0);
        _procTimer = setInterval(nextStep, STEP_DELAY);
      }, PAUSE_AFTER_DONE);
    }
  }

  function startProcessAnim() {
    if (_procStarted) return;
    _procStarted = true;
    setStep(0);
    _procTimer = setInterval(nextStep, STEP_DELAY);
  }

  // ?”ë©´??ë³´ì¼ ???œì‘
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) startProcessAnim();
    });
  }, { threshold: 0.3 });

  document.addEventListener('DOMContentLoaded', () => {
    const section = document.getElementById('processSteps');
    if (section) observer.observe(section);
  });
})();

  '</div>';
};
