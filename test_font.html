<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 700px; height: 700px; overflow: hidden;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex; justify-content: center; align-items: center; }
  .card {
    width: 700px; height: 700px;
    background: linear-gradient(160deg, #0D1630, #1a1f4e, #2d1b69);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 60px;
    position: relative; }
  .glow { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(92,61,232,0.5) 0%, transparent 60%);
    width: 450px; height: 450px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .badge { display: inline-block; background: rgba(167,139,250,0.15);
    color: #a78bfa; font-size: 18px; font-weight: 700; 
    padding: 8px 24px; border: 1px solid rgba(167,139,250,0.3); border-radius: 30px;
    margin-bottom: 28px; z-index: 2; position: relative; letter-spacing: 0.5px; }
  .main { color: #fff; font-size: 48px; font-weight: 800; line-height: 1.4;
    z-index: 2; position: relative; margin-bottom: 16px; word-break: keep-all;
    letter-spacing: -1px; }
  .main em { color: #a78bfa; font-style: normal; }
  .sub { color: rgba(255,255,255,0.6); font-size: 20px; font-weight: 500; line-height: 1.5;
    z-index: 2; position: relative; margin-bottom: 32px; word-break: keep-all; }
  .cta { background: linear-gradient(135deg, #5c3de8, #7c5cf6); color: #fff;
    font-size: 20px; font-weight: 700; padding: 14px 48px; border-radius: 50px; border: none;
    z-index: 2; position: relative; letter-spacing: -0.3px; cursor: pointer; display: inline-block; }
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="badge">🛒 이커머스 마케팅</div>
  <div class="main">쇼핑몰·스마트스토어<br>운영자라면<br><em>숏폼 마케팅</em>에<br>주목해야 하는 이유</div>
  <div class="sub">영상 하나가 전환율을 바꾼다</div>
  <div class="cta">AICUT 무료상담 →</div>
</div>
</body>
</html>
