<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  .card {
    width: 1080px; height: 1080px; background: #FDFAF2;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; position: relative; overflow: hidden;
  }
  .g { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.12) 0%, transparent 65%);
    width: 700px; height: 700px; top: 50%; left: 50%;
    transform: translate(-50%, -50%); }
  .tag { color: #8b5cf6; font-size: 42px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 50px; z-index: 2; position: relative; }
  .main { color: #0D1630; font-size: 148px; font-weight: 900;
    line-height: 1.0; letter-spacing: -4px;
    z-index: 2; position: relative; word-break: keep-all; text-align: center;
    margin-bottom: 50px; }
  .main em { color: #8b5cf6; font-style: normal; display: block; }
  .sub { color: rgba(13,22,48,0.6); font-size: 46px; font-weight: 500;
    line-height: 1.55; z-index: 2; position: relative; margin-bottom: 60px;
    word-break: keep-all; }
  .cta { background: #0D1630; color: #fff;
    font-size: 44px; font-weight: 800; padding: 28px 80px; border-radius: 70px;
    z-index: 2; position: relative; }
  .brand { position: absolute; right: 80px; bottom: 72px;
    color: rgba(13,22,48,0.25); font-size: 34px; font-weight: 900;
    letter-spacing: 4px; z-index: 2; }
</style>
</head>
<body>
<div class="card">
  <div class="g"></div>
  <div class="tag">AI + 전담 에디터</div>
  <div class="main">AI로만<br><em>안 해요</em></div>
  <div class="sub">AI 초안 + 사람 완성<br>평균 48시간 납품</div>
  <div class="cta">샘플 1편 무료 →</div>
  <div class="brand">AICUT</div>
</div>
</body>
</html>
