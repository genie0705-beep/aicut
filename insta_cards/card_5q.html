<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(145deg, #0D1630 0%, #2d1b69 100%);
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; position: relative; overflow: hidden; padding: 80px;
  }
  .g { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,0.4) 0%, transparent 65%);
    width: 700px; height: 700px; top: 50%; left: 50%;
    transform: translate(-50%, -50%); }
  .tag { color: #a78bfa; font-size: 40px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 40px; z-index: 2; position: relative;
    background: rgba(167,139,250,0.15); padding: 12px 40px;
    border: 1px solid rgba(167,139,250,0.3); border-radius: 50px; }
  .main { color: #fff; font-size: 120px; font-weight: 900;
    line-height: 1.15; letter-spacing: -4px;
    z-index: 2; position: relative; word-break: keep-all; text-align: center;
    margin-bottom: 30px; }
  .main em { color: #a78bfa; font-style: normal; }
  .list { color: rgba(255,255,255,0.85); font-size: 44px; font-weight: 500;
    line-height: 1.6; z-index: 2; position: relative;
    word-break: keep-all; text-align: center; margin-bottom: 50px; }
  .cta { background: linear-gradient(135deg, #5c3de8, #7c5cf6); color: #fff;
    font-size: 40px; font-weight: 800; padding: 24px 70px; border-radius: 60px;
    z-index: 2; position: relative; box-shadow: 0 4px 20px rgba(92,61,232,0.4); }
  .brand { position: absolute; right: 70px; bottom: 60px;
    color: rgba(255,255,255,0.3); font-size: 30px; font-weight: 900;
    letter-spacing: 4px; z-index: 2; }
</style>
</head>
<body>
<div class="card">
  <div class="g"></div>
  <div class="tag">📋 영상 편집 외주 가이드</div>
  <div class="main">처음이라면<br><em>꼭 물어봐야 할</em><br>5가지</div>
  <div class="list">
    ① 브랜드 이해도<br>
    ② 수정 범위·횟수<br>
    ③ 납품 일정<br>
    ④ 저작권·소유권<br>
    ⑤ 업종 사례
  </div>
  <div class="cta">무료 상담 →</div>
  <div class="brand">AICUT</div>
</div>
</body>
</html>
