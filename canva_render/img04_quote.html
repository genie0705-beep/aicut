<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{display:flex;justify-content:center;align-items:center;min-height:700px;background:#fff;}
.wrap{width:700px;height:700px;position:relative;overflow:hidden;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;}
.bg{background:linear-gradient(135deg,#1a1a2e 0%,#2d1b69 60%,#5c3de8 100%);position:absolute;inset:0;}
.in{position:relative;z-index:10;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:48px;text-align:center;}
.at{position:absolute;top:20px;left:24px;font-family:'DM Mono',monospace;font-size:9px;color:rgba(255,255,255,0.2);letter-spacing:3px;}
.bl{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#5c3de8,#6c63ff,#a78bfa);}
.ab{position:absolute;bottom:14px;right:24px;font-family:'DM Mono',monospace;font-size:8px;color:rgba(255,255,255,0.15);letter-spacing:2px;}
</style></head><body>
<div class="wrap">
<div class="bg"></div>
<div class="at">AICUT</div>
<div class="in" style="gap:14px;">
<div style="width:56px;height:2px;background:linear-gradient(90deg,#5c3de8,#6c63ff);margin-bottom:4px;"></div>
<p style="font-size:10px;color:rgba(255,255,255,0.25);letter-spacing:3px;">KEY MESSAGE</p>
<h2 style="font-size:26px;font-weight:900;color:#fff;line-height:1.4;">
  "전문직의 신뢰는<br>
  <span style="background:linear-gradient(135deg,#a78bfa,#6c63ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">영상에서 시작</span>됩니다"
</h2>
<p style="font-size:11px;color:rgba(255,255,255,0.3);margin-top:12px;">변호사·세무사·보험설계사<br>당신의 전문성을 영상으로 증명하세요</p>
</div>
<div class="bl"></div><div class="ab">aicut.co.kr</div>
</div>
</body></html>
